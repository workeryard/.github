name: Bug report
description: Something does not work as the readme says it does.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: The smallest code that shows it
      description: Enough to run it. Leave out credentials, tokens, cookies and keys.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Library version, or commit
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Where it ran
      options:
        - Deployed Worker
        - wrangler dev
        - Node
        - Other
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: The full error with its cause, and anything the repository's readme asks bug reports to include.
